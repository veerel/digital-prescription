# Production stack (cloud or LAN). Run from the deploy/ directory:
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d
#
# Only Caddy (ports 80/443) is reachable from outside. Postgres and the
# backend are on an internal network.
name: ${APP_NAME:-app}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 20

  backend:
    image: ${APP_NAME:-app}-backend:${APP_VERSION:-latest}
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/app
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in deploy/.env}
      COOKIE_SECURE: "true"
      ENABLE_DOCS: "false"
      LOG_LEVEL: INFO
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      retries: 10

  web:
    image: ${APP_NAME:-app}-web:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.${DEPLOY_MODE:?set DEPLOY_MODE to cloud or lan}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # certificates, including the LAN root CA: back this up
      - caddy_config:/config
    networks: [internal, public]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  public:
